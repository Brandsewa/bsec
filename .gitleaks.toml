# Secret scan config (CI job `secret-scan`). Extends the default ruleset.
# Test files hold fake keys and fixture identifiers (whsec_..., idemp_..., test secrets), which the generic
# api-key rule flags. Real secrets must never be committed anywhere (AGENTS.md rule 7); this only silences
# fixtures under test directories.
[extend]
useDefault = true

[allowlist]
description = "fixtures in test directories"
paths = [
  '''(^|/)test/''',
  '''(^|/)e2e/''',
  '''\.test\.tsx?$''',
  # Prose false positive: the finance-plan change record on feat/superadmin-themes mentions
  # "idempotency keys, own/marketplace books", which the generic-api-key rule flags. The commit
  # is pushed history, so the line cannot be rephrased away; only this file's path is silenced.
  '''(^|/)docs/changes/2026-10-03-zcode-finance-plan\.md$''',
]
