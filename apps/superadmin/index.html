<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Bs Commerce Super Admin</title>
    <script>
      try {
        var t = localStorage.getItem("bs-theme") || "light";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      :root { --s-bg: #fbfcfb; --s-side: #f6f8f7; --s-line: #e3e8e5; --s-fill: #eceff0; }
      [data-theme="dark"] { --s-bg: #131815; --s-side: #111512; --s-line: #262d29; --s-fill: #222a26; }
      html, body { margin: 0; background: var(--s-bg); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      #boot { display: grid; grid-template-columns: 16rem 1fr; min-height: 100dvh; }
      #boot aside { background: var(--s-side); border-right: 1px solid var(--s-line); padding: 16px; }
      #boot header { height: 48px; border-bottom: 1px solid var(--s-line); background: var(--s-bg); }
      #boot .b { background: var(--s-fill); border-radius: 6px; margin: 0 0 10px; }
      #boot .page { max-width: 80rem; margin: 0 auto; padding: 24px 32px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <aside>
          <div class="b" style="height: 28px; width: 120px; margin-bottom: 24px"></div>
          <div class="b" style="height: 20px; width: 80%"></div>
          <div class="b" style="height: 20px; width: 70%"></div>
          <div class="b" style="height: 20px; width: 75%"></div>
          <div class="b" style="height: 20px; width: 60%"></div>
        </aside>
        <div>
          <header></header>
          <div class="page">
            <div class="b" style="height: 36px; width: 220px; margin-bottom: 24px"></div>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px">
              <div class="b" style="height: 96px"></div>
              <div class="b" style="height: 96px"></div>
              <div class="b" style="height: 96px"></div>
              <div class="b" style="height: 96px"></div>
            </div>
            <div class="b" style="height: 300px"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
