<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Bs Commerce Super Admin</title>
    <link rel="preload" href="/node_modules/geist/dist/fonts/geist-sans/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem("bs-theme") || "system";
          var resolved = stored;
          if (stored === "system") {
            resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
    <style>
      :root { --background: #fcfdfc; --sidebar: #f7f9f8; --border: #e3e8e5; --muted: #edf1ee; }
      [data-theme="dark"] { --background: #0f1311; --sidebar: #131715; --border: #222925; --muted: #1c221e; }
      html, body { margin: 0; background: var(--background); font-family: var(--font-sans, "Geist", system-ui, sans-serif); }
      #boot { display: grid; grid-template-columns: 16rem 1fr; min-height: 100dvh; }
      #boot aside { background: var(--sidebar); border-right: 1px solid var(--border); padding: 16px; }
      #boot header { height: 48px; border-bottom: 1px solid var(--border); background: var(--background); }
      #boot .b { background: var(--muted); border-radius: 6px; margin: 0 0 10px; }
      #boot .page { max-width: 80rem; margin: 0 auto; padding: 24px 32px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <aside>
          <div class="b" style="height: 28px; width: 120px; margin-bottom: 24px"></div>
          <div class="b" style="height: 20px; width: 80%"></div>
          <div class="b" style="height: 20px; width: 70%"></div>
          <div class="b" style="height: 20px; width: 75%"></div>
          <div class="b" style="height: 20px; width: 60%"></div>
        </aside>
        <div>
          <header></header>
          <div class="page">
            <div class="b" style="height: 36px; width: 220px; margin-bottom: 24px"></div>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px">
              <div class="b" style="height: 96px"></div>
              <div class="b" style="height: 96px"></div>
              <div class="b" style="height: 96px"></div>
              <div class="b" style="height: 96px"></div>
            </div>
            <div class="b" style="height: 300px"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
