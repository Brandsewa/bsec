name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-fast:
    name: typecheck · lint · build · unit-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:fast

  check-heavy:
    name: heavy integration tests (real postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bsec
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bsec"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Real Postgres service container for all *.int.test.ts files.
      # packages/domain/vitest.config.ts enforces fileParallelism: false and bootstrapRoles() uses advisory locks to prevent races.
      TEST_DATABASE_URL_SUPERUSER: postgres://postgres:postgres@localhost:5432/bsec
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:heavy

  images:
    name: build images → GHCR
    needs: [check-fast, check-heavy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: [web, platform, worker, admin, migrate]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io/brandsewa/bsec-<app>; image names must be lowercase.
          images: ghcr.io/${{ github.repository_owner }}/bsec-${{ matrix.app }}
          tags: |
            type=sha,format=long
            type=raw,value=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Ephemeral staging: run the exact images just pushed, on the runner, smoke-test, tear down.
  # Replaces a persistent staging VPS (cost/simplicity call, 2026-09-29). Fresh random secrets
  # per run; never touches production data or credentials.
  staging-smoke-test:
    name: staging smoke test (ephemeral compose)
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE_TAG: sha-${{ github.sha }}  # docker/metadata-action type=sha prefixes "sha-"
      COMPOSE: docker compose -f docker-compose.staging.yml
    steps:
      - uses: actions/checkout@v5
      - name: Generate per-run secrets
        run: |
          for v in POSTGRES_PASSWORD APP_OWNER_PASSWORD APP_RW_PASSWORD APP_PLATFORM_PASSWORD; do
            val=$(openssl rand -hex 16); echo "::add-mask::$val"; echo "$v=$val" >> "$GITHUB_ENV"
          done
      - name: Start stack (pulls images from GHCR)
        run: |
          $COMPOSE pull
          # --wait blocks until services are running/healthy; migrate is a one-shot dependency.
          $COMPOSE up -d --wait
      - name: Assert migrate completed successfully
        run: |
          code=$($COMPOSE ps -a --format '{{.Service}} {{.ExitCode}}' | awk '$1=="migrate"{print $2}')
          echo "migrate exit code: $code"; test "$code" = "0"
      - name: Smoke test /health endpoints
        run: |
          check() { # url, expected role ("" = none expected), extra jq filter
            for i in $(seq 1 30); do
              body=$(curl -fsS "$1" 2>/dev/null) && break; sleep 2
            done
            echo "$1 -> $body"
            echo "$body" | jq -e '.status == "ok"' >/dev/null
            if [ -n "$2" ]; then echo "$body" | jq -e --arg r "$2" '.db.ok == true and .db.role == $r' >/dev/null; fi
          }
          check http://127.0.0.1:3000/api/health app_rw
          check http://127.0.0.1:4000/health app_platform
          check http://127.0.0.1:4100/health app_rw
          check http://127.0.0.1:8080/health ""
          # TODO(M4/M5): once order placement lands, place a real COD test order against
          # http://127.0.0.1:3000 here (M5 exit criterion: proven "on staging").
      - name: Dump logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail=100
      - name: Tear down (always)
        if: always()
        run: |
          $COMPOSE down -v
          echo "remaining containers:"; $COMPOSE ps -a

  deploy-production:
    name: deploy production (Coolify)
    needs: [images, staging-smoke-test]
    runs-on: ubuntu-24.04
    # Required reviewers on the "production" environment gate this job (GitHub → Settings →
    # Environments → production). COOLIFY_TOKEN is a Coolify API token, permission "Deploy" only
    # (Keys & Tokens → API Tokens). Resource UUIDs below aren't secret, just identifiers.
    environment: production
    env:
      COOLIFY_URL: https://server.brandsewa.com
      MIGRATE_UUID: qqqlm48eqo7f8pnfwn766suc
      APP_UUIDS: 7wuzc3xhtzhxud3315pjutnd,w4awz0y3fxzxtwstps1srgfi,ecfwkdh7citlanfto6gpgqdv,miz7k30kdqjwmqgiru4k9xtz
    steps:
      - name: Run migration (bsec-migrate; bootstraps roles once, always migrates)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$MIGRATE_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
          # No read-scoped token to poll deployment status; migrate finishes in ~15-20s
          # (observed). Give it comfortable headroom before the apps redeploy.
          sleep 45
      - name: Deploy web, platform, worker, admin
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUIDS&force=false" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
