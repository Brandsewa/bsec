name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: filter
        name: Check for docs-only PR
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Push to main: running full suite."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The checkout is the PR merge commit (depth 2): its first parent is the base the PR merges into, so this diff
          # needs no extra fetch and cannot fail with "no merge base" when the base branch moved after the run started.
          if ! changed=$(git diff --name-only HEAD^1 HEAD); then
            echo "Could not list changed files: running the full suite."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files in PR:"
          echo "$changed"

          # Check if all changed files match docs-only pattern (docs/**, *.md, .github/ISSUE_TEMPLATE/**)
          docs_only=true
          if [ -z "$changed" ]; then
            docs_only=false
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [[ "$file" =~ ^docs/ ]] || [[ "$file" =~ \.md$ ]] || [[ "$file" =~ ^\.github/ISSUE_TEMPLATE/ ]]; then
              continue
            else
              echo "Non-docs file detected: $file"
              docs_only=false
              break
            fi
          done <<< "$changed"

          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  check-fast:
    name: typecheck · lint · build · unit-test
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Turborepo's local cache survives between runs, so unchanged packages skip lint/typecheck/build/test.
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-fast-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-fast-
      - run: pnpm install --frozen-lockfile
      - name: "Fast check - docs:check"
        run: pnpm docs:check
      - name: "Fast check - lint"
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm lint
      - name: Typecheck
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm typecheck
      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm build
      - name: Unit Tests
        if: needs.changes.outputs.docs_only != 'true'
        # Files run one at a time: apps/platform's suites share one database (AGENTS.md section 4) and the jsdom
        # route tests time out when many workers fight for the Docker VM's memory. A 2-core hosted runner was
        # serial by accident; this PC is not.
        run: pnpm exec turbo run test:fast -- --no-file-parallelism
      - name: Fast path notice
        if: needs.changes.outputs.docs_only == 'true'
        run: 'echo "Docs-only PR: docs:check succeeded; skipping lint, typecheck, build, and unit tests."'

  # Sharded: every *.int.test.ts file in packages/domain is its own slow suite and dominates the run, so it is split
  # in two; everything else shares one job. Each job has its own Postgres, so shards never collide (AGENTS.md section 4).
  # Within a job it is still one package at a time and one vitest worker; vitest 5 ignores VITEST_MAX_WORKERS.
  check-heavy-shard:
    name: heavy shard (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: domain 1/2
            filter: "@bs/domain"
            args: "--shard=1/2"
          - name: domain 2/2
            filter: "@bs/domain"
            args: "--shard=2/2"
          - name: db, platform, web
            filter: "!@bs/domain"
            args: ""
            build_web: true
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bsec
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bsec"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Real Postgres service container for all *.int.test.ts files.
      # packages/domain/vitest.config.ts enforces fileParallelism: false and bootstrapRoles() uses advisory locks to prevent races.
      TEST_DATABASE_URL_SUPERUSER: postgres://postgres:postgres@localhost:5432/bsec
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-heavy-${{ matrix.build_web && 'web' || 'domain' }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-heavy-${{ matrix.build_web && 'web' || 'domain' }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@bs/web..." build # perf-budget-bundle.int.test.ts reads .next
        if: matrix.build_web
      # --only: run just the filtered packages' test:heavy, not their dependencies' (the dependency would run in every shard).
      - run: pnpm exec turbo run test:heavy --only --filter='${{ matrix.filter }}' --concurrency=1 -- --no-file-parallelism ${{ matrix.args }}

  # Stable required-check name: branch protection keeps pointing at "heavy integration tests (real postgres)"
  # whatever the shard layout is. A skipped shard job (docs-only PR) counts as success.
  check-heavy:
    name: heavy integration tests (real postgres)
    needs: [changes, check-heavy-shard]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every shard to pass
        env:
          RESULT: ${{ needs.check-heavy-shard.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          if [ "$DOCS_ONLY" = "true" ]; then echo "Docs-only PR: heavy suite skipped."; exit 0; fi
          echo "shards: $RESULT"; test "$RESULT" = "success"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the PR diff
      # Gitleaks CLI image, not gitleaks-action: the action needs a paid license on organization repos.
      # Config and fixture allowlist: .gitleaks.toml. Run as the runner uid so git trusts the checkout.
      - run: >
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --config /repo/.gitleaks.toml --no-banner --redact

  # Builds run alongside the tests, not after them, and push only the immutable sha tag. The moving `main` tag that
  # production pulls is applied by promote-images once every gate has passed, so a red run never changes what `main` means.
  images:
    name: build images → GHCR
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: [web, platform, worker, admin, superadmin, migrate]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT" # registry refs must be lowercase
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # ghcr.io/brandsewa/bsec-<app>; image names must be lowercase.
          images: ghcr.io/${{ github.repository_owner }}/bsec-${{ matrix.app }}
          tags: |
            type=sha,format=long
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          # Registry cache: the 10 GB Actions cache limit forced mode=min, which kept only the final layers and made most
          # builds cold. GHCR has no such cap, so mode=max keeps every layer (install, build) reusable.
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.name }}/bsec-cache:${{ matrix.app }}
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.name }}/bsec-cache:${{ matrix.app }},mode=max,image-manifest=true,oci-mediatypes=true

  # Ephemeral staging: run the exact images just pushed, on the runner, smoke-test, tear down.
  # Replaces a persistent staging VPS (cost/simplicity call, 2026-09-29). Fresh random secrets
  # per run; never touches production data or credentials.
  staging-smoke-test:
    name: staging smoke test (ephemeral compose)
    needs: [images, check-fast, check-heavy, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: sha-${{ github.sha }}  # docker/metadata-action type=sha prefixes "sha-"
      COMPOSE: docker compose -f docker-compose.staging.yml
    steps:
      - uses: actions/checkout@v7
      # New GHCR packages start private; log in so the pull works whatever their visibility.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate per-run secrets
        run: |
          for v in POSTGRES_PASSWORD APP_OWNER_PASSWORD APP_RW_PASSWORD APP_PLATFORM_PASSWORD APP_SAAS_PASSWORD E2E_PASSWORD; do
            val=$(openssl rand -hex 16); echo "::add-mask::$val"; echo "$v=$val" >> "$GITHUB_ENV"
          done
          for v in BETTER_AUTH_SECRET TENANT_SECRETS_KEY; do
            val=$(openssl rand -hex 32); echo "::add-mask::$val"; echo "$v=$val" >> "$GITHUB_ENV"
          done
      - name: Start stack (pulls images from GHCR)
        run: |
          $COMPOSE pull
          # --wait blocks until services are running/healthy; migrate is a one-shot dependency.
          $COMPOSE up -d --wait
      - name: Assert migrate completed successfully
        run: |
          code=$($COMPOSE ps -a --format '{{.Service}} {{.ExitCode}}' | awk '$1=="migrate"{print $2}')
          echo "migrate exit code: $code"; test "$code" = "0"
      - name: Smoke test /health endpoints
        run: |
          check() { # url, expected role ("" = none expected), extra jq filter
            for i in $(seq 1 30); do
              body=$(curl -fsS "$1" 2>/dev/null) && break; sleep 2
            done
            echo "$1 -> $body"
            echo "$body" | jq -e '.status == "ok"' >/dev/null
            if [ -n "$2" ]; then echo "$body" | jq -e --arg r "$2" '.db.ok == true and .db.role == $r' >/dev/null; fi
          }
          check http://127.0.0.1:3000/api/health app_rw
          check http://127.0.0.1:4000/health app_platform
          check http://127.0.0.1:4100/health app_rw
          check http://127.0.0.1:8080/health ""
          check http://127.0.0.1:8081/health ""
          # TODO(M4/M5): once order placement lands, place a real COD test order against
          # http://127.0.0.1:3000 here (M5 exit criterion: proven "on staging").
      - name: Seed a store, an owner login and the demo store (operator tools from the images)
        run: |
          $COMPOSE exec -T postgres psql -U postgres -d bsec -v ON_ERROR_STOP=1 -c "insert into organizations (id, name) values ('0199b000-0000-7000-8000-000000000000', 'CI Org'); insert into tenants (id, organization_id, slug, name) values ('0199b000-0000-7000-8000-000000000001', '0199b000-0000-7000-8000-000000000000', 'ci-store', 'CI Store'); insert into domains (tenant_id, hostname, type, is_primary, status) values ('0199b000-0000-7000-8000-000000000001', 'ci-store.bcom.si', 'platform_subdomain', true, 'active'); insert into store_status (tenant_id, mode) values ('0199b000-0000-7000-8000-000000000001', 'live'); insert into markets (id, tenant_id, name, handle, is_base, status, currency, tax_display) values ('0199b000-0000-7000-8000-000000000002', '0199b000-0000-7000-8000-000000000001', 'India', 'in', true, 'active', 'INR', 'inclusive'); insert into market_countries (tenant_id, market_id, country) values ('0199b000-0000-7000-8000-000000000001', '0199b000-0000-7000-8000-000000000002', 'IN');"
          $COMPOSE run --rm --no-deps -e OWNER_EMAIL=owner@ci.example -e OWNER_NAME="CI Owner" -e OWNER_PASSWORD="$E2E_PASSWORD" -e STORE_SLUG=ci-store worker node dist/create-owner.js
          $COMPOSE run --rm --no-deps -e OWNER_EMAIL=owner@ci.example platform node dist/demo.js seed
          # First platform staff login (the Super Admin e2e sets up its authenticator through the UI)
          $COMPOSE run --rm --no-deps -e STAFF_EMAIL=owner@ci.example -e STAFF_NAME="CI Owner" -e STAFF_PASSWORD="$E2E_PASSWORD" platform node dist/create-staff.js
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @bs/e2e
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @bs/e2e exec playwright install --with-deps chromium
      - name: Browser end-to-end tests (real admin in a real browser against this stack)
        env:
          ADMIN_URL: http://127.0.0.1:8080
          API_URL: http://127.0.0.1:3000
          E2E_EMAIL: owner@ci.example
          SUPERADMIN_URL: http://127.0.0.1:8081
          PLATFORM_API_URL: http://127.0.0.1:4000
          STAFF_EMAIL: owner@ci.example
          STAFF_PASSWORD: ${{ env.E2E_PASSWORD }}
        run: pnpm --filter @bs/e2e e2e
      - name: Upload browser test report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Dump logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail=100
      - name: Tear down (always)
        if: always()
        run: |
          $COMPOSE down -v
          echo "remaining containers:"; $COMPOSE ps -a

  # Point the moving `main` tag at the exact images that just passed every gate (no rebuild, a manifest copy).
  promote-images:
    name: promote images → main tag
    needs: [images, staging-smoke-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, platform, worker, admin, superadmin, migrate]
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          img="ghcr.io/$owner/bsec-${{ matrix.app }}"
          docker buildx imagetools create -t "$img:main" "$img:sha-${{ github.sha }}"

  deploy-production:
    name: deploy production (Coolify)
    needs: [promote-images]
    runs-on: ubuntu-24.04
    # Required reviewers on the "production" environment gate this job (GitHub → Settings →
    # Environments → production). COOLIFY_TOKEN is a Coolify API token, permission "Deploy" only
    # (Keys & Tokens → API Tokens). Resource UUIDs below aren't secret, just identifiers.
    environment: production
    env:
      COOLIFY_URL: https://server.brandsewa.com
      MIGRATE_UUID: qqqlm48eqo7f8pnfwn766suc
      APP_UUIDS: 7wuzc3xhtzhxud3315pjutnd,w4awz0y3fxzxtwstps1srgfi,ecfwkdh7citlanfto6gpgqdv,miz7k30kdqjwmqgiru4k9xtz,mvpbrx2k9jp3q1invu8ayk48
    steps:
      - name: Run migration (bsec-migrate; bootstraps roles once, always migrates)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$MIGRATE_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
          # No read-scoped token to poll deployment status; migrate finishes in ~15-20s
          # (observed). Give it comfortable headroom before the apps redeploy.
          sleep 45
      - name: Deploy web, platform, worker, admin, superadmin
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUIDS&force=false" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
