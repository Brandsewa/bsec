name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bsec
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bsec"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Integration tests use this instead of starting Testcontainers.
      TEST_DATABASE_URL_SUPERUSER: postgres://postgres:postgres@localhost:5432/bsec
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  images:
    name: build images → GHCR
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: [web, platform, worker, admin, migrate]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io/brandsewa/bsec-<app>; image names must be lowercase.
          images: ghcr.io/${{ github.repository_owner }}/bsec-${{ matrix.app }}
          tags: |
            type=sha,format=long
            type=raw,value=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # No staging environment yet (single shared VPS for now, RUNBOOK §TODO). This job deploys
  # straight to production once approved. Add a deploy-staging job ahead of this one when the
  # staging VPS exists — same shape, different Coolify resource UUIDs.
  deploy-production:
    name: deploy production (Coolify)
    needs: images
    runs-on: ubuntu-24.04
    # Required reviewers on the "production" environment gate this job (GitHub → Settings →
    # Environments → production). COOLIFY_TOKEN is a Coolify API token, permission "Deploy" only
    # (Keys & Tokens → API Tokens). Resource UUIDs below aren't secret, just identifiers.
    environment: production
    env:
      COOLIFY_URL: https://server.brandsewa.com
      MIGRATE_UUID: qqqlm48eqo7f8pnfwn766suc
      APP_UUIDS: 7wuzc3xhtzhxud3315pjutnd,w4awz0y3fxzxtwstps1srgfi,ecfwkdh7citlanfto6gpgqdv,miz7k30kdqjwmqgiru4k9xtz
    steps:
      - name: Run migration (bsec-migrate; bootstraps roles once, always migrates)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$MIGRATE_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
          # No read-scoped token to poll deployment status; migrate finishes in ~15-20s
          # (observed). Give it comfortable headroom before the apps redeploy.
          sleep 45
      - name: Deploy web, platform, worker, admin
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUIDS&force=false" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
