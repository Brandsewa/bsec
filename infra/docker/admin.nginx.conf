# add_header inside a location replaces the server-level set, so each location repeats the security headers.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Redirects (the POST to GET one below) stay relative: behind the proxy this container listens on 8080, the public site does not.
  absolute_redirect off;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"admin"}';
  }

  # Hashed assets: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # SPA fallback; index.html is never cached so deploys take effect immediately.
  location / {
    # Cashfree sends the merchant back after a plan payment with a POST; a static site answers that with 405.
    # Turn it into a plain GET of the same page (303 See Other) so the SPA loads.
    if ($request_method = POST) {
      return 303 $uri;
    }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri /index.html;
  }
}
