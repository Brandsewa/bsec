# pgBackRest configuration for bsec (PostgreSQL 18 Continuous Archiving & Point-In-Time Recovery)
# Target: RPO <= 15 min, RTO <= 2 h (PLAN §14, M6 hardening)

[global]
repo1-type=s3
repo1-s3-endpoint=7a0533854a8ded58696db809f403f26c.r2.cloudflarestorage.com
repo1-s3-region=auto
repo1-s3-bucket=bsec-backups
repo1-s3-uri-style=path
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=30
repo1-retention-diff=7
process-max=2
compress-type=zst
compress-level=3
start-fast=y
log-level-console=info
log-level-file=detail

# Credential injection via environment variables on the pgBackRest sidecar container:
# PGBACKREST_REPO1_S3_KEY
# PGBACKREST_REPO1_S3_KEY_SECRET
# PGBACKREST_REPO1_CIPHER_PASS

[bsec]
pg1-path=/var/lib/postgresql/18/docker
pg1-user=postgres
