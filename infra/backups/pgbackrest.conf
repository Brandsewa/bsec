# Draft — validate on staging before production (infra/backups/README.md).
[global]
repo1-type=s3
repo1-s3-endpoint=<account-id>.r2.cloudflarestorage.com
repo1-s3-region=auto
repo1-s3-bucket=bsec-pgbackrest-<env>
repo1-s3-uri-style=path
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=30
process-max=2
compress-type=zst
start-fast=y
log-level-console=info
# repo1-s3-key, repo1-s3-key-secret, repo1-cipher-pass come from PGBACKREST_* env vars.

[bsec]
pg1-path=/var/lib/postgresql/18/docker
