# pgBackRest settings baked into the bsec-postgres image (infra/docker/postgres.Dockerfile), docs/BACKUP-DR-PLAN.md G1.
# Non-secret and account-free on purpose. Set these on the bsec-postgres resource (Coolify env), never in a file:
#   PGBACKREST_REPO1_S3_ENDPOINT      <account-id>.r2.cloudflarestorage.com   (no https://)
#   PGBACKREST_REPO1_S3_BUCKET        bsec-pgbackrest
#   PGBACKREST_REPO1_S3_KEY           R2 access key id        (Object Read & Write, scoped to that bucket)
#   PGBACKREST_REPO1_S3_KEY_SECRET    R2 secret access key
#   PGBACKREST_REPO1_CIPHER_PASS      repository encryption passphrase: store a copy OUTSIDE Coolify and the VPS,
#                                     without it every backup is unreadable (plan section on secrets)
# Archiving only turns on when all five are present (infra/docker/postgres-entrypoint.sh).

[global]
repo1-type=s3
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=30
repo1-retention-diff=7
process-max=2
compress-type=zst
compress-level=3
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[bsec]
# The official image's PGDATA for Postgres 18 (volume mounted at /var/lib/postgresql).
pg1-path=/var/lib/postgresql/18/docker
pg1-user=postgres
