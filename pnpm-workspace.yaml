packages:
  - apps/*
  - packages/*
  - e2e
onlyBuiltDependencies:
  - esbuild
# Security fixes for transitive dependencies Dependabot cannot bump (GitHub alerts, 2026-10-30).
# Each line forces the patched version only where an older one would be installed; remove a line once the
# parent package ships it. Not overridden on purpose: esbuild 0.18 (drizzle-kit tooling, dev only) and
# deepmerge (no patched release exists).
overrides:
  "fast-uri@<3.1.9": "3.1.9"
  "seroval@<1.6.11": "1.6.11"
  "systeminformation@<5.33.16": "5.33.16"
  "happy-dom@<21.0.4": "21.0.4"
  "body-parser@<2.4.0": "2.4.0"
  "follow-redirects@<1.16.1": "1.16.1"
  "source-map-js@<1.2.2": "1.2.2"
  "zod@>=4.0.0 <4.6.6": "4.6.7"
